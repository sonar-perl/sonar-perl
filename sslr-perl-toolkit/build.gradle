plugins {
    id 'java-library'
    id "jacoco"
}

repositories {
    mavenCentral()
}

compileJava {
    options.release = 21
}

jacoco {
    toolVersion = '0.8.11'
}
jacocoTestReport {
    reports {
        xml.required = true
    }
}

test {
    finalizedBy jacocoTestReport 
}

dependencies {
    implementation group: 'org.sonarsource.sslr', name: 'sslr-toolkit', version: '1.25.1.3886'
    runtimeOnly group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.32'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.7'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    implementation project(":perl-frontend")
}
